<!doctype html>
<html lang="he" dir="rtl" translate="no" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/images/hamania/icon-48.png"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/images/hamania/icon-180.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-title" content="החמניה" />
    <meta name="application-name" content="סורק הנכסים של החמניה" />
    <meta name="description" content="סורק הנכסים של החמניה" />
    <meta property="og:image" content="/images/hamania/icon-512.png" />
    <meta property="og:description" content="סורק הנכסים של החמניה" />
    <meta property="og:title" content="סורק הנכסים של החמניה" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/images/hamania/icon-512.png" />

    <meta name="twitter:description" content="סורק הנכסים של החמניה" />
    <meta name="twitter:title" content="סורק הנכסים של החמניה" />
    <title>סורק הנכסים של החמניה</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      /* react-data-grid declares its layer when it loads; keep it below twenty-ui. */
      @layer rdg, twenty-ui;

      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      /* Hamania: dark before the app loads, whatever the OS colour scheme */
      html,
      body {
        background-color: var(--theme-dark-background-secondary);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
